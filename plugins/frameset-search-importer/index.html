<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Frame Set Search Importer</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="toolbar">
        <div class="brand"><span class="brand-mark">F</span><span>Frame Set Search</span></div>
        <form id="searchForm" class="search-form">
          <input id="searchInput" type="search" placeholder="Search Frame Set" aria-label="Search Frame Set" autocomplete="off" />
          <button id="searchButton" class="primary-button" type="submit">Search</button>
        </form>
        <span id="targetLabel" class="target-label">Saving to: Library</span>
        <button id="settingsButton" class="toolbar-button" type="button" aria-label="Settings" title="Settings" aria-expanded="false" aria-controls="settingsPanel">Settings</button>
      </header>
      <section id="settingsPanel" class="settings-panel" aria-label="Import settings" hidden>
        <label><input id="addFrameSetTag" type="checkbox" checked /> Add Frame Set tag</label>
        <label><input id="addSearchTag" type="checkbox" /> Add search-term tag</label>
        <button id="resetSettingsButton" class="toolbar-button" type="button">Reset</button>
        <button id="clearHistoryButton" class="toolbar-button" type="button" disabled>Clear history</button>
      </section>
      <section id="resultsPanel" class="results-panel" aria-label="Frame Set results">
        <div class="results-header">
          <div><h1 id="resultsTitle">Search Frame Set</h1><p id="resultsSubtitle">Search cinematic references and save still frames into Eagle.</p></div>
          <div class="result-meta"><span id="sessionStatus" role="status" aria-live="polite">Ready</span><span id="resultCount">0 frames</span><span id="importCounts" role="status" aria-live="polite">Imported 0 · Queued 0 · Failed 0</span></div>
        </div>
        <div id="resultsGrid" class="results-grid" aria-live="polite"></div>
        <div id="emptyState" class="empty-state"><div class="empty-icon">⌕</div><h2 id="emptyTitle">Search Frame Set from Eagle</h2><p id="emptyMessage">Your still-frame results will appear here in a wide Eagle-native grid.</p></div>
      </section>
    </main>
    <script src="js/plugin.js"></script>
  </body>
</html>
