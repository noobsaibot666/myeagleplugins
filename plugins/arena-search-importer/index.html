<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Are.na Search Importer</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main id="appShell" class="app-shell">
      <header class="toolbar">
        <div class="brand"><span class="brand-mark">A</span><span>Are.na Search Importer</span></div>
        <form id="searchForm" class="search-form"><input id="searchInput" type="search" placeholder="Search Are.na" aria-label="Search Are.na" autocomplete="off" /><button id="searchButton" class="primary-button" type="button">Search</button></form>
        <span id="targetLabel" class="target-label">Saving to: Library</span>
        <button id="settingsButton" class="toolbar-button" type="button" aria-label="Settings" title="Settings" aria-expanded="false" aria-controls="settingsPanel">Settings</button>
      </header>
      <section id="settingsPanel" class="settings-panel" aria-label="Import settings" hidden><label><input id="addArenaTag" type="checkbox" checked /> Add Are.na tag</label><label><input id="addSearchTag" type="checkbox" /> Add search-term tag</label><button id="resetSettingsButton" class="toolbar-button" type="button">Reset</button><button id="clearHistoryButton" class="toolbar-button" type="button" disabled>Clear history</button></section>
      <nav class="search-tabs" aria-label="Search mode"><span class="active-tab">Keyword search</span></nav>
      <section id="resultsPanel" class="results-panel" role="tabpanel"><div class="results-header"><div><h1 id="resultsTitle">Search Are.na</h1><p id="resultsSubtitle">Choose a keyword to start collecting visual references.</p></div><div class="result-meta"><span id="sessionStatus" role="status" aria-live="polite">Ready</span><span id="resultCount">0 results</span><span id="importCounts" role="status" aria-live="polite">Imported 0 · Queued 0 · Failed 0</span></div></div><div id="resultsGrid" class="results-grid" aria-live="polite"></div><div class="load-more-wrap"><button id="loadMoreButton" class="toolbar-button" type="button" hidden>Load more results</button></div><div id="emptyState" class="empty-state"><div class="empty-icon">⌕</div><h2 id="emptyTitle">Search Are.na from Eagle</h2><p id="emptyMessage">Your image results will appear here as an Eagle-native collection.</p></div></section>
    </main>
    <script src="js/plugin.js"></script>
  </body>
</html>
